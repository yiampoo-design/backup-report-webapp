<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ - Backup Report</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <span class="eyebrow">PYLON IT OPERATIONS</span>
      <h1>Backup Report</h1>
      <p>เข้าสู่ระบบเพื่อสร้างและดูรายงานสำรองข้อมูล</p>
      <form id="loginForm">
        <label>ชื่อผู้ใช้<input id="username" name="username" autocomplete="username" autofocus required></label>
        <label>รหัสผ่าน<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <div id="loginError" class="form-error" aria-live="polite"></div>
        <button id="loginButton" class="button primary full" type="submit">เข้าสู่ระบบ</button>
      </form>
    </section>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
